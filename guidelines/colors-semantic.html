<!-- @dsCard group="Colors" viewport="700x190" name="Semantic Feedback" subtitle="Success, warning, danger, info" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;flex-direction:column;gap:8px;font-family:var(--font-mono);font-size:11px;padding:10px">
<div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font-family:var(--font-label)">Success</span><div style="flex:1;background:#EAFBF0;padding:10px;border-radius:4px;color:#16803D">tint #EAFBF0</div><div style="flex:1;background:#22C55E;padding:10px;border-radius:4px;color:#fff">base #22C55E</div></div>
<div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font-family:var(--font-label)">Warning</span><div style="flex:1;background:#FEF3C7;padding:10px;border-radius:4px;color:#B45309">tint #FEF3C7</div><div style="flex:1;background:#F59E0B;padding:10px;border-radius:4px;color:#fff">base #F59E0B</div></div>
<div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font-family:var(--font-label)">Danger</span><div style="flex:1;background:#FBEAEA;padding:10px;border-radius:4px;color:#BA1A1A">tint #FBEAEA</div><div style="flex:1;background:#BA1A1A;padding:10px;border-radius:4px;color:#fff">base #BA1A1A</div></div>
<div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font-family:var(--font-label)">Info</span><div style="flex:1;background:#EAF2FE;padding:10px;border-radius:4px;color:#1D4ED8">tint #EAF2FE</div><div style="flex:1;background:#3B82F6;padding:10px;border-radius:4px;color:#fff">base #3B82F6</div></div>
<div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font-family:var(--font-label)">Stable</span><div style="flex:1;background:#fff;border:1px solid #E2E8F0;padding:10px;border-radius:4px;color:#00303A">dot only</div><div style="flex:1;background:#4CD7F6;padding:10px;border-radius:4px;color:#00303A">base #4CD7F6</div></div>
</div>
